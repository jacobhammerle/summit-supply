name: qa-swarm

concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: true

jobs:
  fingerprint:
    name: Calculate iOS fingerprint
    type: fingerprint
    environment: preview

  ios_get_build:
    name: Find reusable simulator build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: simulator
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  ios_repack:
    name: Reuse simulator build
    needs: [ios_get_build]
    if: ${{ needs.ios_get_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.ios_get_build.outputs.build_id }}
      profile: simulator
      message: "QA swarm repack"

  ios_build:
    name: Build iOS simulator app
    needs: [ios_get_build]
    if: ${{ !needs.ios_get_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: simulator
      message: "QA swarm build"

  qa_signup:
    name: "QA agent 1: sign up"
    after: [ios_repack, ios_build]
    if: ${{ after.ios_repack.status == 'success' || after.ios_build.status == 'success' }}
    environment: preview
    runs_on: linux-medium
    env:
      BUILD_ID: ${{ after.ios_repack.outputs.build_id || after.ios_build.outputs.build_id }}
      FLOW: signup
      APPLICATION_ID: dev.expo.summitsupply
      IOS_SIM_DEVICE: iPhone 17
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm install -g --no-audit --no-fund --loglevel=error @swmansion/argent @anthropic-ai/claude-code eas-cli@21.8.0
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [app]
      - id: run_agent_qa
        run: bash ./scripts/agent-qa/run-flow.sh "${{ steps.download_build.outputs.artifact_path }}"
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-signup
          path: |
            artifacts/**/*

  qa_checkout:
    name: "QA agent 2: checkout"
    after: [ios_repack, ios_build]
    if: ${{ after.ios_repack.status == 'success' || after.ios_build.status == 'success' }}
    environment: preview
    runs_on: linux-medium
    env:
      BUILD_ID: ${{ after.ios_repack.outputs.build_id || after.ios_build.outputs.build_id }}
      FLOW: checkout
      APPLICATION_ID: dev.expo.summitsupply
      IOS_SIM_DEVICE: iPhone 17
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm install -g --no-audit --no-fund --loglevel=error @swmansion/argent @anthropic-ai/claude-code eas-cli@21.8.0
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [app]
      - id: run_agent_qa
        run: bash ./scripts/agent-qa/run-flow.sh "${{ steps.download_build.outputs.artifact_path }}"
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-checkout
          path: |
            artifacts/**/*

  qa_settings:
    name: "QA agent 3: settings"
    after: [ios_repack, ios_build]
    if: ${{ after.ios_repack.status == 'success' || after.ios_build.status == 'success' }}
    environment: preview
    runs_on: linux-medium
    env:
      BUILD_ID: ${{ after.ios_repack.outputs.build_id || after.ios_build.outputs.build_id }}
      FLOW: settings
      APPLICATION_ID: dev.expo.summitsupply
      IOS_SIM_DEVICE: iPhone 17
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm install -g --no-audit --no-fund --loglevel=error @swmansion/argent @anthropic-ai/claude-code eas-cli@21.8.0
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [app]
      - id: run_agent_qa
        run: bash ./scripts/agent-qa/run-flow.sh "${{ steps.download_build.outputs.artifact_path }}"
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-settings
          path: |
            artifacts/**/*

  qa_support:
    name: "QA agent 4: support ticket"
    after: [ios_repack, ios_build]
    if: ${{ after.ios_repack.status == 'success' || after.ios_build.status == 'success' }}
    environment: preview
    runs_on: linux-medium
    env:
      BUILD_ID: ${{ after.ios_repack.outputs.build_id || after.ios_build.outputs.build_id }}
      FLOW: support
      APPLICATION_ID: dev.expo.summitsupply
      IOS_SIM_DEVICE: iPhone 17
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm install -g --no-audit --no-fund --loglevel=error @swmansion/argent @anthropic-ai/claude-code eas-cli@21.8.0
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [app]
      - id: run_agent_qa
        run: bash ./scripts/agent-qa/run-flow.sh "${{ steps.download_build.outputs.artifact_path }}"
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-support
          path: |
            artifacts/**/*

  qa_offline:
    name: "QA agent 5: offline sync"
    after: [ios_repack, ios_build]
    if: ${{ after.ios_repack.status == 'success' || after.ios_build.status == 'success' }}
    environment: preview
    runs_on: linux-medium
    env:
      BUILD_ID: ${{ after.ios_repack.outputs.build_id || after.ios_build.outputs.build_id }}
      FLOW: offline
      APPLICATION_ID: dev.expo.summitsupply
      IOS_SIM_DEVICE: iPhone 17
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm install -g --no-audit --no-fund --loglevel=error @swmansion/argent @anthropic-ai/claude-code eas-cli@21.8.0
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [app]
      - id: run_agent_qa
        run: bash ./scripts/agent-qa/run-flow.sh "${{ steps.download_build.outputs.artifact_path }}"
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-offline
          path: |
            artifacts/**/*
