# QA Swarm — five Argent-driven QA agents on five iOS Simulators in parallel.
#
# Kick off manually:
#   eas workflow:run qa-swarm.yml
#
# Job graph:
#   fingerprint ─→ ios_get_build ─→ ios_repack (reuse) ──┐
#                                └→ ios_build (fresh) ───┤
#                                                        ├─→ qa_signup
#                                                        ├─→ qa_checkout
#                                                        ├─→ qa_settings
#                                                        ├─→ qa_support
#                                                        └─→ qa_offline
#
# Each qa_* job starts its OWN remote EAS Simulator session
# (`eas simulator:start --platform ios --type argent`), installs the build
# on it, and runs a headless Claude Code agent whose Argent MCP server is
# bound to that session. Argent gives the agent control of the app: launch,
# tap, type, screenshots, accessibility tree. No simulator runs on the
# worker itself - the five sessions appear on the project's
# "Simulator sessions" page while the swarm runs.
#
# The qa_* jobs run on linux-medium ON PURPOSE. A simulator session needs a
# macOS VM on EAS's side; when the five QA jobs also held macos-medium
# workers, the account was asking for ten macOS VMs at once and the sessions
# deadlocked in "Waiting for argent session to be ready". On Linux the jobs
# need nothing from macOS (argent is an HTTP client here, claude is Node),
# and the whole macOS pool is free for the five simulator sessions.
#
# run-flow.sh stops its session on every exit path; a session bills until
# stopped. A robot access token (EAS_SIMULATOR_EXPO_TOKEN) is required to
# create sessions - the auto-injected job-scoped EXPO_TOKEN cannot.
#
# Requires: CLAUDE_CODE_OAUTH_TOKEN set as an EAS environment variable in
# the "preview" environment (visibility: secret).

name: qa-swarm

concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: true

jobs:
  fingerprint:
    name: Calculate iOS fingerprint
    type: fingerprint
    environment: preview

  ios_get_build:
    name: Find reusable simulator build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: simulator
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  ios_repack:
    name: Reuse simulator build
    needs: [ios_get_build]
    if: ${{ needs.ios_get_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.ios_get_build.outputs.build_id }}
      profile: simulator
      message: "QA swarm repack"

  ios_build:
    name: Build iOS simulator app
    needs: [ios_get_build]
    if: ${{ !needs.ios_get_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: simulator
      message: "QA swarm build"

  qa_signup:
    name: "QA agent 1: sign up"
    after: [ios_repack, ios_build]
    if: ${{ after.ios_repack.status == 'success' || after.ios_build.status == 'success' }}
    environment: preview
    runs_on: linux-medium
    env:
      BUILD_ID: ${{ after.ios_repack.outputs.build_id || after.ios_build.outputs.build_id }}
      FLOW: signup
      APPLICATION_ID: dev.expo.summitsupply
      IOS_SIM_DEVICE: iPhone 17
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm install -g @swmansion/argent @anthropic-ai/claude-code eas-cli@21.8.0
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [app]
      - id: run_agent_qa
        run: bash ./scripts/agent-qa/run-flow.sh "${{ steps.download_build.outputs.artifact_path }}"
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-signup
          path: |
            artifacts/**/*

  qa_checkout:
    name: "QA agent 2: checkout"
    after: [ios_repack, ios_build]
    if: ${{ after.ios_repack.status == 'success' || after.ios_build.status == 'success' }}
    environment: preview
    runs_on: linux-medium
    env:
      BUILD_ID: ${{ after.ios_repack.outputs.build_id || after.ios_build.outputs.build_id }}
      FLOW: checkout
      APPLICATION_ID: dev.expo.summitsupply
      IOS_SIM_DEVICE: iPhone 17
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm install -g @swmansion/argent @anthropic-ai/claude-code eas-cli@21.8.0
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [app]
      - id: run_agent_qa
        run: bash ./scripts/agent-qa/run-flow.sh "${{ steps.download_build.outputs.artifact_path }}"
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-checkout
          path: |
            artifacts/**/*

  qa_settings:
    name: "QA agent 3: settings"
    after: [ios_repack, ios_build]
    if: ${{ after.ios_repack.status == 'success' || after.ios_build.status == 'success' }}
    environment: preview
    runs_on: linux-medium
    env:
      BUILD_ID: ${{ after.ios_repack.outputs.build_id || after.ios_build.outputs.build_id }}
      FLOW: settings
      APPLICATION_ID: dev.expo.summitsupply
      IOS_SIM_DEVICE: iPhone 17
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm install -g @swmansion/argent @anthropic-ai/claude-code eas-cli@21.8.0
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [app]
      - id: run_agent_qa
        run: bash ./scripts/agent-qa/run-flow.sh "${{ steps.download_build.outputs.artifact_path }}"
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-settings
          path: |
            artifacts/**/*

  qa_support:
    name: "QA agent 4: support ticket"
    after: [ios_repack, ios_build]
    if: ${{ after.ios_repack.status == 'success' || after.ios_build.status == 'success' }}
    environment: preview
    runs_on: linux-medium
    env:
      BUILD_ID: ${{ after.ios_repack.outputs.build_id || after.ios_build.outputs.build_id }}
      FLOW: support
      APPLICATION_ID: dev.expo.summitsupply
      IOS_SIM_DEVICE: iPhone 17
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm install -g @swmansion/argent @anthropic-ai/claude-code eas-cli@21.8.0
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [app]
      - id: run_agent_qa
        run: bash ./scripts/agent-qa/run-flow.sh "${{ steps.download_build.outputs.artifact_path }}"
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-support
          path: |
            artifacts/**/*

  qa_offline:
    name: "QA agent 5: offline sync"
    after: [ios_repack, ios_build]
    if: ${{ after.ios_repack.status == 'success' || after.ios_build.status == 'success' }}
    environment: preview
    runs_on: linux-medium
    env:
      BUILD_ID: ${{ after.ios_repack.outputs.build_id || after.ios_build.outputs.build_id }}
      FLOW: offline
      APPLICATION_ID: dev.expo.summitsupply
      IOS_SIM_DEVICE: iPhone 17
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm install -g @swmansion/argent @anthropic-ai/claude-code eas-cli@21.8.0
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [app]
      - id: run_agent_qa
        run: bash ./scripts/agent-qa/run-flow.sh "${{ steps.download_build.outputs.artifact_path }}"
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-offline
          path: |
            artifacts/**/*
